name: Deploy portal to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild seed from data/ (keeps seed.js in sync with employees.csv, assets.json, ...)
        run: python scripts/build_seed.py
      - name: Assemble site (only what browsers need)
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js img _site/
          mkdir _site/data && cp data/mail_log.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
